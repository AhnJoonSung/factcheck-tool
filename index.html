<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팩트체크 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* 레퍼런스: PolitiFact 계열의 팩트체크 매체 UI (흰 바탕, 굵은 산세리프, 연한 파랑 띠, 빨강 행동 버튼, 하늘색 태그, 얇은 구분선 목록).
     로고와 이미지는 쓰지 않고 레이아웃과 색 체계만 참고했다. */
  :root {
    --bg: #ffffff; --ink: #1a1b1f; --sub: #5f6572; --line: #dfe1e6;
    --band: #d9e6fb; --field: #ffffff; --field-line: #1a1b1f;
    --blue: #0b5bd3; --chip: #dbe8ff; --link: #1b64e6;
    --red: #e5173f; --red-ink: #ffffff; --err: #c4001f;
    --v0: #1b7f3a; --v1: #4d8a16; --v2: #f2b705; --v3: #d4600a; --v4: #c62828; --v5: #5b6472;
    --v0b: #6cc388; --v1b: #a6cf5c; --v2b: #f7d56a; --v3b: #f2a35e; --v4b: #e87b7b; --v5b: #9aa3b2;
    --font: "Public Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101218; --ink: #f1f2f5; --sub: #a6adba; --line: #2c303b;
      --band: #17233b; --field: #171a23; --field-line: #c9cfdb;
      --blue: #8db8ff; --chip: #1f2f4f; --link: #8db8ff; --err: #ff7a8e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 19px/1.65 var(--font); }
  a { color: var(--link); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

  /* 머리글 */
  .top { height: 72px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .brand { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .brand .a { color: var(--blue); } .brand .b { color: var(--red); }
  .brand-sub { font-size: 13px; color: var(--sub); margin-top: 2px; }

  /* 키 설정 띠 */
  .band { background: var(--band); padding: 28px 16px; }
  .band-in { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 48px; align-items: start; }
  .band h2 { margin: 0 0 8px; font-size: 28px; font-weight: 800; line-height: 1.25; color: var(--red); }
  .band p { margin: 0; color: var(--ink); max-width: 44ch; }
  .fields label { display: block; font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .fields .f + .f { margin-top: 12px; }
  .pill-in { width: 100%; height: 52px; padding: 0 20px; border: 1.5px solid var(--field-line); border-radius: 999px; background: var(--field); font-size: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn { height: 52px; padding: 0 28px; border-radius: 999px; border: 1.5px solid var(--field-line); background: transparent; font-weight: 800; font-size: 18px; cursor: pointer; white-space: nowrap; transition: transform .12s ease, background-color .12s ease; }
  .btn:hover { background: rgba(127,127,127,.12); }
  .btn:active { transform: scale(.98); }
  .btn.red { background: var(--red); border-color: var(--red); color: var(--red-ink); }
  .btn.red:hover { filter: brightness(.94); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .hint { font-size: 15px; color: var(--ink); margin-top: 10px; min-height: 1.5em; opacity: .85; }

  /* 본문 */
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 80px; }
  .sec-title { text-align: center; font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sec-rule { height: 0; border-top: 1px solid var(--line); margin: 14px 0 24px; }
  .lab { display: block; font-weight: 700; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 120px; padding: 16px 20px; border: 1.5px solid var(--field-line); border-radius: 20px; background: var(--field); font-size: 20px; resize: vertical; }
  ::placeholder { color: var(--sub); opacity: 1; }
  .go-row { display: flex; justify-content: center; margin-top: 20px; }
  .btn.big { height: 58px; padding: 0 44px; font-size: 21px; }

  #status { margin-top: 24px; }
  #statusText { color: var(--sub); font-size: 17px; }
  .skel { margin-top: 12px; display: grid; gap: 8px; }
  .skel i { display: block; height: 14px; border-radius: 7px; background: var(--line); }
  .skel i:nth-child(2) { width: 82%; } .skel i:nth-child(3) { width: 58%; }
  @media (prefers-reduced-motion: no-preference) {
    .skel i { background: linear-gradient(90deg, var(--line) 25%, rgba(127,127,127,.28) 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
  }
  #error { color: var(--err); font-weight: 700; margin-top: 20px; white-space: pre-wrap; }

  /* 결과 */
  #result { margin-top: 44px; }
  .stmt { display: grid; grid-template-columns: 1fr 136px; gap: 20px 24px; align-items: start; }
  .quote { position: relative; padding-left: 22px; }
  .quote::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 6px; border-radius: 3px; background: linear-gradient(var(--vc), var(--vcb)); }
  .tag { display: inline-block; font-size: 15px; font-weight: 800; padding: 1px 10px; border-radius: 6px; background: var(--chip); color: var(--blue); }
  .stated { margin: 8px 0 6px; font-size: 15px; color: var(--sub); }
  .claim-echo { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .meter { width: 136px; text-align: center; }
  .meter-box { border-radius: 16px; padding: 18px 8px; background: var(--vc); color: #fff; font-size: 23px; line-height: 1.25; font-weight: 800; word-break: keep-all; }
  #result[data-v="2"] .meter-box { color: #1a1b1f; }
  .meter-cap { margin-top: 6px; font-size: 13px; color: var(--sub); font-weight: 700; }
  #result[data-v="0"] { --vc: var(--v0); --vcb: var(--v0b); }
  #result[data-v="1"] { --vc: var(--v1); --vcb: var(--v1b); }
  #result[data-v="2"] { --vc: var(--v2); --vcb: var(--v2b); }
  #result[data-v="3"] { --vc: var(--v3); --vcb: var(--v3b); }
  #result[data-v="4"] { --vc: var(--v4); --vcb: var(--v4b); }
  #result[data-v="5"] { --vc: var(--v5); --vcb: var(--v5b); }
  .summary { margin: 28px 0 8px; font-size: 24px; line-height: 1.4; font-weight: 800; letter-spacing: -0.01em; }
  .reason { margin: 0; white-space: pre-wrap; }

  /* 모호한 주장 */
  #clarify { margin-top: 40px; }
  #clarify h2 { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
  .cand { display: block; width: 100%; text-align: left; margin-top: 12px; padding: 14px 20px; border: 1.5px solid var(--field-line); border-radius: 20px; background: transparent; font-weight: 700; line-height: 1.5; cursor: pointer; }
  .cand:hover { background: var(--chip); }
  #clarify .row { margin-top: 16px; }

  /* 근거 목록 */
  #evidence { margin-top: 56px; }
  .ev { display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding: 24px 0; border-top: 1px solid var(--line); }
  #evList .ev:first-child { border-top: 0; padding-top: 8px; }
  .no { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--field-line); display: grid; place-items: center; font-weight: 800; }
  .ev-main { min-width: 0; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .kind { font-size: 14px; font-weight: 800; padding: 1px 10px; border-radius: 6px; background: var(--chip); color: var(--blue); }
  .kind.k-comm { background: #fde3e7; color: #a4001f; }
  .kind.k-etc { background: rgba(127,127,127,.18); color: var(--sub); }
  @media (prefers-color-scheme: dark) { .kind.k-comm { background: #3b1620; color: #ff9aab; } }
  .used { font-size: 14px; font-weight: 800; padding: 1px 10px; border-radius: 6px; background: var(--blue); color: var(--bg); }
  .ev-title { margin: 8px 0 4px; font-size: 22px; line-height: 1.35; font-weight: 800; letter-spacing: -0.01em; }
  .meta { font-size: 15px; color: var(--sub); overflow-wrap: anywhere; }
  .body { margin: 10px 0 0; font-size: 17px; white-space: pre-wrap; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    body { font-size: 18px; }
    .band-in { grid-template-columns: 1fr; gap: 20px; }
    .band h2 { font-size: 24px; }
    .stmt { grid-template-columns: 1fr; }
    .meter { width: auto; display: flex; align-items: center; gap: 12px; order: -1; }
    .meter-box { padding: 12px 20px; font-size: 21px; }
    .claim-echo { font-size: 24px; }
    .ev { grid-template-columns: 36px 1fr; gap: 12px; }
    .no { width: 36px; height: 36px; }
    .btn.big { width: 100%; }
  }

  /* ===== 취재 도우미 챗봇 ===== */
  :root {
    --bubble: #f0f2f6; --ubg: #0b5bd3; --utx: #ffffff; --win-sh: 0 12px 40px rgba(16, 24, 40, .22);
    --z-chat: 1000;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bubble: #1c2030; --ubg: #2a56b5; --utx: #ffffff; --win-sh: 0 12px 40px rgba(0, 0, 0, .6); }
  }
  .ph { line-height: 1; }
  #cbFab { position: fixed; right: 20px; bottom: 20px; z-index: var(--z-chat); display: inline-flex; align-items: center; gap: 12px; height: 68px; padding: 0 28px 0 20px; border-radius: 999px; border: 0; background: var(--red); color: #fff; font-weight: 800; font-size: 20px; cursor: pointer; box-shadow: 0 8px 24px rgba(229, 23, 63, .35); transition: transform .12s ease; }
  #cbFab:hover { filter: brightness(.94); }
  #cbFab:active { transform: scale(.98); }
  #cbFab .ph { font-size: 36px; }
  #cbWin { position: fixed; right: 20px; bottom: 100px; z-index: var(--z-chat); width: 460px; height: 680px; max-width: calc(100vw - 24px); max-height: calc(100dvh - 116px); min-width: 320px; min-height: 420px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); border: 1.5px solid var(--field-line); border-radius: 20px; box-shadow: var(--win-sh); overflow: hidden; }
  #cbWin[hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { #cbWin { animation: cbIn .18s ease-out; } @keyframes cbIn { from { opacity: 0; transform: translateY(8px); } } }
  .cb-grip { position: absolute; left: 0; top: 0; width: 28px; height: 28px; cursor: nwse-resize; z-index: 2; touch-action: none; }
  .cb-grip::before { content: ""; position: absolute; left: 7px; top: 7px; width: 12px; height: 12px; border-left: 3px solid var(--sub); border-top: 3px solid var(--sub); border-top-left-radius: 6px; opacity: .6; }
  .cb-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 36px; border-bottom: 1px solid var(--line); background: var(--band); }
  .cb-head h2 { margin: 0; font-size: 20px; font-weight: 800; flex: 1; display: flex; align-items: center; gap: 8px; }
  .cb-head h2 .ph { font-size: 26px; color: var(--red); }
  .cb-ib { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
  .cb-ib:hover { background: rgba(127, 127, 127, .18); }
  .cb-ib .ph { font-size: 24px; }
  .cb-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
  .m { max-width: 92%; display: flex; flex-direction: column; gap: 6px; }
  .m.user { align-self: flex-end; align-items: flex-end; }
  .m.bot { align-self: flex-start; }
  .bb { padding: 10px 16px; border-radius: 18px; font-size: 17px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.user .bb { background: var(--ubg); color: var(--utx); border-bottom-right-radius: 6px; }
  .m.bot .bb { background: var(--bubble); border-bottom-left-radius: 6px; }
  .bb.err { color: var(--err); font-weight: 700; background: transparent; border: 1.5px solid var(--err); }
  .m.full { max-width: 100%; align-self: stretch; }
  .cb-btn { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--field-line); background: transparent; font-weight: 800; font-size: 16px; cursor: pointer; }
  .cb-btn:hover { background: var(--chip); }
  .cb-btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  .cb-btn.red:hover { filter: brightness(.94); background: var(--red); }
  .cb-btn:disabled { opacity: .55; cursor: default; }
  .cb-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .cb-pick { text-align: left; width: 100%; min-height: 44px; padding: 10px 16px; border-radius: 16px; border: 1.5px solid var(--field-line); background: transparent; font-size: 16px; font-weight: 700; line-height: 1.45; cursor: pointer; }
  .cb-pick:hover { background: var(--chip); }
  .claimbox { border-left: 6px solid var(--blue); padding: 4px 0 4px 14px; }
  .claimbox .k { font-size: 14px; font-weight: 800; color: var(--blue); }
  .claimbox .t { font-size: 18px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
  .inh { display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 800; padding: 1px 10px; border-radius: 6px; background: var(--chip); color: var(--blue); }

  .rc { border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; background: var(--bg); }
  .rc .claim { font-size: 18px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
  .rc .lbl { font-size: 13px; font-weight: 800; color: var(--sub); margin-bottom: 2px; }
  .rc .vrow { display: flex; align-items: center; gap: 12px; margin: 12px 0 8px; }
  .rc .vb { display: inline-block; padding: 8px 18px; border-radius: 14px; background: var(--vc); color: #fff; font-size: 22px; font-weight: 800; }
  .rc[data-v="0"] { --vc: var(--v0); } .rc[data-v="1"] { --vc: var(--v1); } .rc[data-v="2"] { --vc: var(--v2); }
  .rc[data-v="3"] { --vc: var(--v3); } .rc[data-v="4"] { --vc: var(--v4); } .rc[data-v="5"] { --vc: var(--v5); }
  .rc[data-v="2"] .vb { color: #1a1b1f; }
  .rc .sum { font-size: 18px; font-weight: 800; line-height: 1.4; margin: 6px 0; }
  .rc .rsn { font-size: 16px; white-space: pre-wrap; margin: 0 0 10px; }
  .rc .scope { font-size: 14px; color: var(--sub); margin-bottom: 10px; }
  .rc .sub { font-size: 14px; font-weight: 800; margin: 14px 0 6px; }
  .rc ol { list-style: none; margin: 0; padding: 0; }
  .rc li { padding: 10px 0; border-top: 1px solid var(--line); }
  .rc li .l1 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .rc li .n { font-weight: 800; }
  .rc li .ti { font-size: 16px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
  .rc li .dt { font-size: 14px; color: var(--sub); overflow-wrap: anywhere; }
  .rc .next { margin: 0; padding-left: 20px; font-size: 15px; }
  .rc .note { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .rc .acts { margin-top: 12px; }

  .steps { align-self: flex-start; padding: 12px 16px; border-radius: 16px; background: var(--bubble); font-size: 16px; }
  .steps ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .steps li { color: var(--sub); }
  .steps li.on { color: var(--ink); font-weight: 800; }
  .steps li.done { color: var(--ink); }
  .steps li.done::after { content: " 완료"; color: var(--sub); font-weight: 400; }
  .steps .sm { margin-top: 6px; font-size: 13px; color: var(--sub); }

  .cb-comp { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); align-items: flex-end; background: var(--bg); }
  .cb-comp textarea { flex: 1; min-height: 48px; max-height: 140px; padding: 11px 16px; border: 1.5px solid var(--field-line); border-radius: 22px; background: var(--field); font-size: 17px; line-height: 1.45; resize: none; }
  .cb-send { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: var(--red); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .cb-send .ph { font-size: 24px; }
  .cb-send:disabled { opacity: .5; cursor: default; }

  @media (max-width: 600px) {
    #cbWin { right: 0; bottom: 0; left: 0; top: 0; width: auto !important; height: auto !important; max-width: none; max-height: none; min-width: 0; min-height: 0; border-radius: 0; border: 0; }
    #cbFab[aria-expanded="true"] { display: none; }
    .cb-grip { display: none; }
    .cb-head { padding-left: 16px; }
    #cbFab { right: 12px; bottom: 12px; height: 60px; font-size: 18px; padding: 0 22px 0 16px; }
    #cbFab .ph { font-size: 32px; }
  }

</style>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="a">팩트</span><span class="b">체크</span></div>
  <div class="brand-sub">지역 언론 주장 검증 도구</div>
</header>

<section class="band" aria-label="키 설정">
  <div class="band-in">
    <div>
      <h2>API 키는 이 브라우저에만 저장됩니다</h2>
      <p>파일과 저장소에는 남기지 않습니다. 키를 넣고 저장하면 다음에 열 때 자동으로 불러옵니다.</p>
    </div>
    <div class="fields">
      <div class="f">
        <label for="tavilyKey">Tavily 키</label>
        <input class="pill-in" id="tavilyKey" type="password" autocomplete="off" placeholder="tvly-...">
      </div>
      <div class="f">
        <label for="claudeKey">Claude 키</label>
        <input class="pill-in" id="claudeKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      </div>
      <div class="row">
        <button id="saveKeys" class="btn red" type="button">키 저장</button>
        <button id="clearKeys" class="btn" type="button">키 지우기</button>
      </div>
      <div class="hint" id="keyMsg"></div>
    </div>
  </div>
</section>

<main>
  <h1 class="sec-title">주장 검증하기</h1>
  <div class="sec-rule"></div>

  <label class="lab" for="claim">검증할 주장 (한 문장)</label>
  <textarea id="claim" placeholder="예) 2025년 ○○시는 청년 월세 지원금을 20만 원으로 올렸다."></textarea>
  <div class="go-row"><button id="go" class="btn red big" type="button">검증하기</button></div>

  <div id="status" hidden role="status">
    <div id="statusText"></div>
    <div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="error" role="alert" hidden></div>

  <section id="clarify" hidden>
    <h2>주장이 모호합니다. 어느 쪽으로 검증할까요?</h2>
    <div id="clarifyWhy" class="hint"></div>
    <div id="clarifyList"></div>
    <div class="row"><button id="useOriginal" class="btn" type="button">원래 문장 그대로 검증하기</button></div>
  </section>

  <section id="result" hidden aria-live="polite">
    <div class="stmt">
      <div class="quote">
        <span class="tag">검증 결과</span>
        <p class="stated">검증한 주장</p>
        <p class="claim-echo" id="claimEcho"></p>
      </div>
      <div class="meter">
        <div class="meter-box" id="badge"></div>
        <div class="meter-cap">판정</div>
      </div>
    </div>
    <p class="summary" id="summary"></p>
    <p class="reason" id="reason"></p>
  </section>

  <section id="evidence" hidden>
    <h2 class="sec-title">찾은 근거</h2>
    <div class="sec-rule"></div>
    <div id="evList"></div>
  </section>
</main>

<button id="cbFab" type="button" aria-expanded="false" aria-controls="cbWin">
  <i class="ph ph-robot" aria-hidden="true"></i><span>취재 도우미</span>
</button>
<section id="cbWin" role="dialog" aria-label="취재 도우미" hidden>
  <div class="cb-grip" id="cbGrip" aria-hidden="true"></div>
  <div class="cb-head">
    <h2><i class="ph ph-robot" aria-hidden="true"></i>취재 도우미</h2>
    <button class="cb-ib" id="cbNew" type="button" title="새 대화" aria-label="새 대화"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i></button>
    <button class="cb-ib" id="cbDl" type="button" title="대화 내려받기" aria-label="대화 내려받기"><i class="ph ph-download-simple" aria-hidden="true"></i></button>
    <button class="cb-ib" id="cbClose" type="button" title="닫기" aria-label="닫기"><i class="ph ph-x" aria-hidden="true"></i></button>
  </div>
  <div class="cb-list" id="cbList" role="log" aria-live="polite"></div>
  <form class="cb-comp" id="cbForm">
    <textarea id="cbInput" rows="1" placeholder="주장이나 기사 문단을 붙여 넣으세요" aria-label="메시지"></textarea>
    <button class="cb-send" id="cbSend" type="submit" aria-label="보내기"><i class="ph ph-paper-plane-right" aria-hidden="true"></i></button>
  </form>
</section>

<script>
(() => {
  'use strict';

  // 모델 순서: 429(한도 초과)가 오면 다음 모델로 바로 바꿔 다시 시도한다.
  const MODELS = ['claude-sonnet-5-5', 'claude-haiku-5-5'];
  const VERDICTS = ['사실', '대체로 사실', '절반의 사실', '대체로 사실 아님', '사실 아님', '판단 유보'];
  const HOLD = '판단 유보';
  const RETRY_503_MAX = 2;
  const RETRY_503_WAIT_MS = 3000;
  const MAX_RESULTS = 5;
  const FETCH_RESULTS = 20; // 허용 출처만 남기고 5건을 채우려고 넉넉히 받는다

  // 출처 종류 분류 (도메인 기준). 필요하면 목록에 도메인을 추가한다.
  const K_GOV = '정부·공공기관', K_STAT = '통계', K_NEWS = '언론사', K_ENC = '백과사전', K_COMM = '블로그·커뮤니티', K_ETC = '기타';
  const KIND_RANK = { [K_GOV]: 0, [K_STAT]: 1, [K_NEWS]: 2, [K_ENC]: 3, [K_ETC]: 4, [K_COMM]: 5 };
  const KIND_CLASS = { [K_GOV]: 'k-gov', [K_STAT]: 'k-stat', [K_NEWS]: 'k-news', [K_ENC]: 'k-enc', [K_ETC]: 'k-etc', [K_COMM]: 'k-comm' };
  const GOV_SEARCH = ['*.go.kr', 'korea.kr', 'mil.kr', 'bok.or.kr', 'kosis.kr']; // 1차 검색에서 먼저 찾을 정부·공공 도메인
  const DOMAINS = {
    [K_STAT]: ['kosis.kr', 'stat.go.kr', 'index.go.kr', 'data.go.kr', 'ecos.bok.or.kr', 'oecd.org', 'worldbank.org'],
    [K_GOV]: ['go.kr', 'korea.kr', 'mil.kr', 'bok.or.kr', 'gov.kr', 'who.int', 'un.org'],
    [K_ENC]: ['wikipedia.org', 'namu.wiki', 'encykorea.aks.ac.kr', 'terms.naver.com', 'doopedia.co.kr', 'britannica.com'],
    [K_COMM]: [
      'blog.naver.com', 'cafe.naver.com', 'blog.daum.net', 'cafe.daum.net', 'tistory.com', 'brunch.co.kr', 'velog.io', 'medium.com', 'blogspot.com',
      'instagram.com', 'facebook.com', 'twitter.com', 'x.com', 'threads.net', 'youtube.com', 'tiktok.com',
      'reddit.com', 'dcinside.com', 'fmkorea.com', 'clien.net', 'pann.nate.com', 'quora.com', 'ruliweb.com', 'theqoo.net', 'instiz.net'
    ],
    [K_NEWS]: [
      'yna.co.kr', 'yonhapnewstv.co.kr', 'newsis.com', 'news1.kr', 'kbs.co.kr', 'mbc.co.kr', 'imbc.com', 'sbs.co.kr', 'jtbc.co.kr',
      'ytn.co.kr', 'ebs.co.kr', 'tvchosun.com', 'channela.com', 'mbn.co.kr', 'nocutnews.co.kr',
      'chosun.com', 'joongang.co.kr', 'donga.com', 'hani.co.kr', 'khan.co.kr', 'hankookilbo.com', 'seoul.co.kr', 'munhwa.com',
      'segye.com', 'kmib.co.kr', 'mk.co.kr', 'hankyung.com', 'sedaily.com', 'edaily.co.kr', 'mt.co.kr', 'fnnews.com', 'asiae.co.kr',
      'heraldcorp.com', 'ohmynews.com', 'pressian.com', 'mediatoday.co.kr', 'newspim.com', 'etnews.com', 'kukinews.com', 'dt.co.kr',
      'busan.com', 'kookje.co.kr', 'imaeil.com', 'yeongnam.com', 'kwnews.co.kr', 'kado.net', 'jbnews.com', 'cctoday.co.kr',
      'daejonilbo.com', 'jeonmae.co.kr', 'kjdaily.com', 'jjan.kr', 'jejunews.com', 'halla.com', 'ulsanpress.net', 'kyeongin.com',
      'kgnews.co.kr', 'joongboo.com', 'kihoilbo.co.kr', 'ggilbo.com', 'incheonilbo.com', 'idomin.com', 'knnews.co.kr', 'gnnews.co.kr',
      'news.naver.com', 'n.news.naver.com', 'v.daum.net',
      'reuters.com', 'apnews.com', 'bbc.com', 'bbc.co.uk', 'nytimes.com', 'washingtonpost.com', 'bloomberg.com', 'cnn.com'
    ]
  };
  function hostMatch(host, list) { return list.some(d => host === d || host.endsWith('.' + d)); }
  function classify(u) {
    let host;
    try { host = new URL(u).hostname.toLowerCase(); } catch { return K_ETC; }
    if (hostMatch(host, DOMAINS[K_COMM]) || /^(blog|cafe)\./.test(host)) return K_COMM;
    if (hostMatch(host, DOMAINS[K_STAT])) return K_STAT;
    if (hostMatch(host, DOMAINS[K_GOV]) || /\.gov(\.[a-z]{2})?$/.test(host)) return K_GOV;
    if (hostMatch(host, DOMAINS[K_ENC])) return K_ENC;
    if (hostMatch(host, DOMAINS[K_NEWS])) return K_NEWS;
    return K_ETC;
  }

  const LS_T = 'factcheck.tavilyKey';
  const LS_G = 'factcheck.claudeKey';

  const $ = id => document.getElementById(id);
  let currentClaim = '';
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- 키 보관 (이 브라우저의 localStorage에만) ----------
  function storeGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
  function storeSet(k, v) { localStorage.setItem(k, v); }
  function storeDel(k) { localStorage.removeItem(k); }

  function keyMsg(text, isErr) {
    const el = $('keyMsg');
    el.textContent = text;
    el.style.color = isErr ? 'var(--err)' : '';
  }

  $('tavilyKey').value = storeGet(LS_T);
  $('claudeKey').value = storeGet(LS_G);

  $('saveKeys').addEventListener('click', () => {
    try {
      storeSet(LS_T, $('tavilyKey').value.trim());
      storeSet(LS_G, $('claudeKey').value.trim());
      keyMsg('키를 이 브라우저에 저장했습니다.');
    } catch {
      keyMsg('이 브라우저가 저장을 막고 있습니다(시크릿 창 등). 지금 화면에서는 입력한 키로 검증할 수 있지만 다음에 열면 다시 입력해야 합니다.', true);
    }
  });

  $('clearKeys').addEventListener('click', () => {
    try { storeDel(LS_T); storeDel(LS_G); } catch { /* 무시 */ }
    $('tavilyKey').value = '';
    $('claudeKey').value = '';
    keyMsg('이 브라우저에 저장된 키를 지웠습니다.');
  });

  // ---------- 화면 도우미 ----------
  function showError(msg) {
    const el = $('error');
    el.textContent = msg;
    el.hidden = false;
  }
  function clearOutput() {
    $('error').hidden = true; $('error').textContent = '';
    $('result').hidden = true;
    $('clarify').hidden = true;
    $('evidence').hidden = true;
    $('evList').replaceChildren();
  }
  function setStatus(msg) {
    $('statusText').textContent = msg;
    $('status').hidden = !msg;
  }

  class UserError extends Error {}

  // ---------- Tavily ----------
  async function tavilyRaw(claim, key, extra) {
    let res;
    try {
      res = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify(Object.assign({ query: claim, search_depth: 'basic', include_answer: false }, extra))
      });
    } catch {
      throw new UserError('Tavily에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 브라우저가 이 요청을 막고 있는지(CORS) 확인해 주세요.');
    }
    const fail = (msg) => { const e = new UserError(msg); e.status = res.status; return e; };
    if (res.status === 401 || res.status === 403) throw fail('Tavily 키가 올바르지 않거나 권한이 없습니다. (오류 ' + res.status + ')');
    if (res.status === 429) throw fail('Tavily 사용 한도를 넘었습니다. 잠시 뒤 다시 시도해 주세요. (오류 429)');
    if (!res.ok) throw fail('Tavily 검색에 실패했습니다. (오류 ' + res.status + ')');
    let data;
    try { data = await res.json(); } catch { throw new UserError('Tavily 응답을 읽지 못했습니다.'); }
    return Array.isArray(data.results) ? data.results : [];
  }

  function toEvidence(r) {
    const url = String((r && r.url) || '');
    return {
      title: String(r.title || '(제목 없음)'),
      url,
      date: String(r.published_date || r.publishedDate || ''),
      content: String(r.content || ''),
      kind: classify(url)
    };
  }

  // 정부·공공기관 도메인에서 먼저 찾고, 일반 검색으로 보충한 뒤 출처 종류 순(정부 → 통계 → 언론 → 백과 → 기타 → 블로그)으로 5건을 고른다.
  // scope(선택): { kinds: [출처 종류], domains: [도메인], timeRange: 'day'|'week'|'month'|'year' }. 없으면 위 기본 동작 그대로다.
  async function searchTavily(claim, key, scope) {
    scope = scope || {};
    const tr = scope.timeRange ? { time_range: scope.timeRange } : {};
    const kinds = scope.kinds && scope.kinds.length ? scope.kinds : null;
    const domains = scope.domains && scope.domains.length ? scope.domains : null;
    const isOfficial = k => k === K_GOV || k === K_STAT;
    const wantGov = !domains && (!kinds || kinds.some(isOfficial));
    const wantGeneral = !!domains || !kinds || kinds.some(k => !isOfficial(k));

    let govList = [];
    if (wantGov) {
      try {
        govList = await tavilyRaw(claim, key, Object.assign({ max_results: wantGeneral ? 10 : FETCH_RESULTS, include_domains: GOV_SEARCH }, tr));
      } catch (e) {
        if (e && (e.status === 401 || e.status === 403 || e.status === 429)) throw e;
        govList = []; // 정부 도메인 지정 검색이 실패해도 일반 검색으로 계속한다.
      }
    }
    let general = [];
    if (wantGeneral || govList.length === 0) {
      const extra = Object.assign({ max_results: FETCH_RESULTS }, tr);
      if (domains) extra.include_domains = domains;
      general = await tavilyRaw(claim, key, extra);
    }
    const seen = new Set();
    let merged = [];
    for (const r of govList.concat(general)) {
      const url = String((r && r.url) || '');
      if (!url || seen.has(url)) continue;
      seen.add(url);
      merged.push(toEvidence(r));
    }
    if (domains) {
      merged = merged.filter(e => { try { return hostMatch(new URL(e.url).hostname.toLowerCase(), domains); } catch { return false; } });
    }
    if (kinds) merged = merged.filter(e => kinds.includes(e.kind));
    merged.sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind]); // 같은 종류 안에서는 검색 순서 유지
    return merged.slice(0, MAX_RESULTS);
  }

  // ---------- Claude ----------
  function buildPrompt(claim, evidence) {
    const ev = evidence.map((e, i) =>
      `[근거 ${i + 1}]\n출처 종류: ${e.kind}\n제목: ${e.title}\n날짜: ${e.date || '날짜 정보 없음'}\n주소: ${e.url}\n내용: ${e.content}`
    ).join('\n\n');
    return [
      '당신은 지역 언론사의 팩트체크 보조자입니다. 아래 [주장]을 오직 [근거]만 보고 판정하세요.',
      '',
      '규칙:',
      '1. 근거에 없는 내용을 지어내거나 당신이 아는 지식으로 보충하지 마세요.',
      '2. 주장 속 사람 이름, 기관, 지역, 날짜가 근거와 정확히 맞을 때만 그 근거를 쓰세요. 이름 일부만 같거나 다른 지역·기관·시점이면 관련 없는 근거로 보고 쓰지 마세요.',
      '3. 주장과 직접 관련된 근거가 하나도 없으면 판정은 "판단 유보"입니다.',
      '4. 판정은 다음 6개 중 정확히 하나만 쓰세요: ' + VERDICTS.join(' / '),
      '5. 이유의 각 문장 끝에 근거 번호를 [1], [2] 형태로 붙이세요.',
      '6. used 에는 실제로 판정에 쓴 근거 번호(정수)만 넣으세요.',
      '7. 정부·공공기관, 통계 자료를 가장 우선하고 언론사, 백과사전 순으로 신뢰하세요. 블로그·커뮤니티 글은 근거로 인정하지 말고, 공식 자료나 언론 기사와 어긋나면 그쪽을 따르세요. 블로그·커뮤니티 글만으로는 판정하지 마세요.',
      '',
      '반드시 report_verdict 도구를 호출해 verdict(판정), summary(한 줄 요약), reason(이유), used(사용한 근거 번호들)를 답하세요.',
      '',
      '[주장]',
      claim,
      '',
      '[근거]',
      ev
    ].join('\n');
  }

  const VERDICT_TOOL = {
    name: 'report_verdict',
    label: '판정하는',
    description: '팩트체크 판정을 보고한다.',
    input_schema: {
      type: 'object',
      properties: {
        verdict: { type: 'string', enum: VERDICTS },
        summary: { type: 'string' },
        reason: { type: 'string' },
        used: { type: 'array', items: { type: 'integer' } }
      },
      required: ['verdict', 'summary', 'reason', 'used']
    }
  };

  async function callClaudeOnce(model, key, prompt, tool) {
    try {
      return await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          max_tokens: 1500,
          messages: [{ role: 'user', content: prompt }],
          tools: [{ name: tool.name, description: tool.description, input_schema: tool.input_schema }]
        })
      });
    } catch {
      throw new UserError('Claude에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 브라우저가 이 요청을 막고 있는지(CORS) 확인해 주세요.');
    }
  }

  async function errDetail(res) {
    try { const j = await res.json(); return j && j.error && j.error.message ? ' - ' + j.error.message : ''; } catch { return ''; }
  }

  // 429(한도 초과) → 다음 모델로 즉시 교체, 503·529(사용량 많음) → 3초 쉬고 같은 모델로 최대 2번 재시도
  async function askClaude(prompt, key, tool, onStatus) {
    const say = onStatus || setStatus;
    for (let m = 0; m < MODELS.length; m++) {
      const model = MODELS[m];
      let retry = 0;
      for (;;) {
        say('Claude(' + model + ')가 ' + tool.label + ' 중…' + (retry ? ' (재시도 ' + retry + '/' + RETRY_503_MAX + ')' : ''));
        const res = await callClaudeOnce(model, key, prompt, tool);
        if (res.ok) {
          let data;
          try { data = await res.json(); } catch { throw new UserError('Claude 응답을 읽지 못했습니다.'); }
          return { data, model };
        }
        if (res.status === 429) break; // 다음 모델로
        if (res.status === 503 || res.status === 529) {
          if (retry < RETRY_503_MAX) { retry++; await sleep(RETRY_503_WAIT_MS); continue; }
          throw new UserError('Claude 사용량이 많아 응답하지 못했습니다. 3초 간격으로 ' + RETRY_503_MAX + '번 다시 시도했지만 실패했습니다. 잠시 뒤 다시 눌러 주세요. (오류 ' + res.status + ', 모델 ' + model + ')');
        }
        const detail = await errDetail(res);
        if (res.status === 401 || res.status === 403) {
          throw new UserError('Claude 키가 올바르지 않거나 권한이 없습니다. (오류 ' + res.status + ')' + detail);
        }
        if (res.status === 404) {
          throw new UserError('Claude 모델 "' + model + '"을(를) 찾을 수 없습니다. 모델 이름을 확인해 주세요. (오류 404)' + detail);
        }
        throw new UserError('Claude 호출에 실패했습니다. (오류 ' + res.status + ', 모델 ' + model + ')' + detail);
      }
    }
    throw new UserError('Claude 사용 한도를 넘었습니다. 모델 ' + MODELS.join(', ') + ' 모두 한도 초과(429)입니다. 잠시 뒤 다시 시도해 주세요.');
  }

  function parseClaudeResult(data) {
    const blocks = data && Array.isArray(data.content) ? data.content : [];
    const tu = blocks.find(b => b && b.type === 'tool_use' && b.input && typeof b.input === 'object');
    if (tu) return tu.input;
    // 도구 대신 글로 답했을 때: 글 속 JSON 을 꺼내 본다.
    const text = blocks.filter(b => b && b.type === 'text').map(b => b.text || '').join('');
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch { /* 아래에서 null */ } }
    return null;
  }

  // ---------- 모호한 주장 점검 ----------
  const CLARIFY_TOOL = {
    name: 'report_clarity',
    label: '주장을 점검하는',
    description: '주장이 검증 가능한 만큼 구체적인지 보고한다.',
    input_schema: {
      type: 'object',
      properties: {
        ambiguous: { type: 'boolean' },
        missing: { type: 'array', items: { type: 'string' } },
        candidates: { type: 'array', items: { type: 'string' } }
      },
      required: ['ambiguous', 'missing', 'candidates']
    }
  };

  function buildClarifyPrompt(claim) {
    return [
      '당신은 지역 언론사의 팩트체크 보조자입니다. 아래 [주장]을 검색으로 검증하기 전에, 검증할 수 있을 만큼 구체적인지 점검하세요.',
      '',
      '모호하다고 볼 기준: 비교·평가의 기준이 없음("많다", "늘었다", "최고"), 기간이 없음("최근", "요즘"), 지역·범위가 없음("우리 지역", "전국인지 시·군인지 불명"), 주체(누가·어느 기관)가 불분명함.',
      '',
      '규칙:',
      '1. 사람 이름, 기관, 지역, 날짜, 숫자가 이미 충분히 구체적이면 ambiguous 는 false 이고 candidates 는 빈 배열입니다. 사소한 표현 차이는 모호한 것이 아닙니다.',
      '2. ambiguous 가 true 이면 missing 에 빠진 것(기준, 기간, 지역, 주체 중)을 적고, candidates 에 검증할 수 있게 다듬은 한 문장 후보를 2~3개 쓰세요.',
      '3. 후보는 원래 주장의 뜻을 유지하면서 서로 다른 해석(예: 기간이나 범위가 다름)이어야 합니다.',
      '4. 원래 주장에 없는 사람 이름, 기관, 숫자, 사실을 지어 넣지 마세요. 빠진 기준·기간·지역만 채우세요.',
      '5. 후보는 각각 완결된 한 문장이어야 합니다.',
      '',
      '반드시 report_clarity 도구를 호출해 답하세요.',
      '',
      '[주장]',
      claim
    ].join('\n');
  }

  function showClarify(claim, missing, candidates) {
    $('clarifyWhy').textContent = missing.length ? '빠진 정보: ' + missing.join(', ') : '';
    const list = $('clarifyList');
    list.replaceChildren();
    candidates.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cand'; b.textContent = c;
      b.addEventListener('click', () => { $('claim').value = c; verify(true); });
      list.append(b);
    });
    $('useOriginal').onclick = () => verify(true);
    $('clarify').hidden = false;
  }

  // ---------- 판정 정리 (AI 답을 그대로 믿지 않는다) ----------
  function normalizeVerdict(v) {
    const s = String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    return VERDICTS.includes(s) ? s : HOLD;
  }

  function finalize(parsed, evidence) {
    const evCount = evidence.length;
    if (!parsed) {
      return { verdict: HOLD, summary: 'AI의 답을 해석하지 못해 판단을 유보합니다.', reason: 'AI 응답이 약속된 JSON 형식이 아니었습니다.', used: [] };
    }
    const used = Array.isArray(parsed.used)
      ? [...new Set(parsed.used.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= evCount))].sort((a, b) => a - b)
      : [];
    let verdict = normalizeVerdict(parsed.verdict);
    let summary = String(parsed.summary || '').trim();
    let reason = String(parsed.reason || '').trim();
    if (verdict !== HOLD && used.length > 0 && used.every(n => evidence[n - 1].kind === K_COMM)) {
      verdict = HOLD;
      reason = '판정에 쓴 근거가 모두 블로그·커뮤니티 글이어서 판단을 유보합니다.' + (reason ? '\n(AI 설명) ' + reason : '');
    }
    if (verdict !== HOLD && used.length === 0) {
      // 근거 번호 없이 내린 판정은 인정하지 않는다.
      verdict = HOLD;
      reason = '판정에 쓴 근거 번호가 없어 판단을 유보합니다.' + (reason ? '\n(AI 설명) ' + reason : '');
    }
    if (!summary) summary = verdict === HOLD ? '주장을 판단할 직접 근거가 부족합니다.' : '';
    return { verdict, summary, reason, used };
  }

  // ---------- 그리기 (모든 외부 글자는 textContent 로만) ----------
  function safeHttpUrl(u) {
    try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch { return ''; }
  }

  function renderResult(r) {
    const idx = Math.max(0, VERDICTS.indexOf(r.verdict));
    $('result').dataset.v = String(idx);
    $('claimEcho').textContent = currentClaim;
    $('badge').textContent = r.verdict;
    $('summary').textContent = r.summary;
    $('reason').textContent = r.reason;
    $('result').hidden = false;
  }

  function renderEvidence(evidence, used) {
    const list = $('evList');
    list.replaceChildren();
    evidence.forEach((e, i) => {
      const n = i + 1;
      const box = document.createElement('article'); box.className = 'ev';
      const no = document.createElement('div'); no.className = 'no'; no.textContent = String(n);
      no.setAttribute('aria-label', '근거 ' + n + '번');
      const main = document.createElement('div'); main.className = 'ev-main';
      const tags = document.createElement('div'); tags.className = 'tags';
      const kind = document.createElement('span'); kind.className = 'kind ' + (KIND_CLASS[e.kind] || 'k-etc'); kind.textContent = e.kind;
      tags.append(kind);
      if (used.includes(n)) {
        const tag = document.createElement('span'); tag.className = 'used'; tag.textContent = '판정에 사용';
        tags.append(tag);
      }
      const title = document.createElement('h3'); title.className = 'ev-title'; title.textContent = e.title;
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.append(document.createTextNode((e.date || '날짜 정보 없음') + ' / '));
      const href = safeHttpUrl(e.url);
      if (href) {
        const a = document.createElement('a');
        a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = e.url;
        meta.append(a);
      } else {
        meta.append(document.createTextNode(e.url || '주소 없음'));
      }
      const body = document.createElement('p'); body.className = 'body'; body.textContent = e.content;
      main.append(tags, title, meta, body);
      box.append(no, main);
      list.append(box);
    });
    $('evidence').hidden = evidence.length === 0;
  }

  // ---------- 검색 + 판정 (판정 화면과 챗봇이 함께 쓴다) ----------
  async function judge(claim, tKey, cKey, scope, onStatus) {
    const say = onStatus || setStatus;
    say('Tavily에서 근거를 찾는 중…');
    const evidence = await searchTavily(claim, tKey, scope);

    // 근거 0건: Claude에게 묻지 않고 무조건 판단 유보
    if (evidence.length === 0) {
      return { evidence, result: { verdict: HOLD, summary: '관련 근거를 찾지 못했습니다.', reason: '검색 결과가 0건이어서 판단을 유보합니다. 주장을 더 구체적으로(이름, 기관, 지역, 날짜) 적어 다시 검증해 보세요.', used: [] } };
    }

    // 근거가 블로그·커뮤니티뿐이면 Claude에게 묻지 않고 판단 유보
    if (evidence.every(e => e.kind === K_COMM)) {
      return { evidence, result: { verdict: HOLD, summary: '블로그·커뮤니티 글뿐이어서 판단을 유보합니다.', reason: '찾은 근거가 모두 블로그·커뮤니티 글입니다. 정부·공공기관, 통계, 언론사 자료가 확인되지 않아 판정하지 않습니다.', used: [] } };
    }

    const { data } = await askClaude(buildPrompt(claim, evidence), cKey, VERDICT_TOOL, say);
    return { evidence, result: finalize(parseClaudeResult(data), evidence) };
  }

  // ---------- 검증 ----------
  async function verify(skipClarify) {
    clearOutput();
    const claim = $('claim').value.trim();
    currentClaim = claim;
    const tKey = $('tavilyKey').value.trim();
    const cKey = $('claudeKey').value.trim();
    if (!claim) return showError('검증할 주장을 먼저 입력해 주세요.');
    if (!tKey) return showError('Tavily 키를 입력해 주세요.');
    if (!cKey) return showError('Claude 키를 입력해 주세요.');

    $('go').disabled = true;
    try {
      if (!skipClarify) {
        const { data: cd } = await askClaude(buildClarifyPrompt(claim), cKey, CLARIFY_TOOL);
        const c = parseClaudeResult(cd);
        const cands = c && Array.isArray(c.candidates)
          ? c.candidates.map(x => String(x || '').trim()).filter(Boolean).slice(0, 3) : [];
        if (c && c.ambiguous === true && cands.length >= 2) {
          showClarify(claim, Array.isArray(c.missing) ? c.missing.map(String) : [], cands);
          return;
        }
      }
      const { evidence, result } = await judge(claim, tKey, cKey, null, setStatus);
      renderResult(result);
      renderEvidence(evidence, result.used);
    } catch (e) {
      showError(e instanceof UserError ? e.message : '알 수 없는 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    } finally {
      setStatus('');
      $('go').disabled = false;
    }
  }

  $('go').addEventListener('click', () => verify(false));

  // 챗봇(아래 두 번째 스크립트)이 판정 화면과 같은 기능을 부르는 입구
  window.FactCheck = {
    VERDICTS, HOLD, MODELS, DOMAINS, UserError,
    KINDS: { GOV: K_GOV, STAT: K_STAT, NEWS: K_NEWS, ENC: K_ENC, COMM: K_COMM, ETC: K_ETC },
    KIND_CLASS,
    getKeys: () => ({ tavily: $('tavilyKey').value.trim(), claude: $('claudeKey').value.trim() }),
    judge, askClaude, parseClaudeResult, safeHttpUrl
  };
})();
</script>
<script>
/* 취재 도우미 챗봇: 판정 화면이 열어 둔 window.FactCheck 의 검색·판정 기능을 그대로 불러 쓴다. */
(() => {
  'use strict';
  const FC = window.FactCheck;
  if (!FC) return;
  const $ = id => document.getElementById(id);
  const K = FC.KINDS;

  const LS_CHAT = 'factcheck.chat.v1';
  const LS_SIZE = 'factcheck.chat.size';
  const MAX_MSGS = 80;
  const EVID_CONTENT_CAP = 600;

  // 지역 언론 도메인 (이 페이지에 정리해 둔 목록 기준. 목록에 없는 언론사는 포함되지 않는다.)
  const REGIONS = {
    '대구경북': { names: '영남일보, 매일신문', domains: ['yeongnam.com', 'imaeil.com'] },
    '부산': { names: '부산일보, 국제신문', domains: ['busan.com', 'kookje.co.kr'] },
    '울산': { names: '울산매일 등', domains: ['ulsanpress.net'] },
    '경남': { names: '경남신문, 경남도민일보, 경남일보', domains: ['knnews.co.kr', 'idomin.com', 'gnnews.co.kr'] },
    '광주전남': { names: '광주일보, 전남매일', domains: ['kjdaily.com', 'jeonmae.co.kr'] },
    '전북': { names: '전북일보', domains: ['jjan.kr'] },
    '대전충청': { names: '충청투데이, 대전일보, 중부매일, 금강일보', domains: ['cctoday.co.kr', 'daejonilbo.com', 'jbnews.com', 'ggilbo.com'] },
    '강원': { names: '강원일보, 강원도민일보', domains: ['kwnews.co.kr', 'kado.net'] },
    '경기인천': { names: '경인일보, 경기일보, 중부일보, 기호일보, 인천일보', domains: ['kyeongin.com', 'kgnews.co.kr', 'joongboo.com', 'kihoilbo.co.kr', 'incheonilbo.com'] },
    '제주': { names: '제주일보 등, 한라일보', domains: ['jejunews.com', 'halla.com'] }
  };
  const TIME_LABEL = { day: '최근 하루', week: '최근 한 주', month: '최근 한 달', year: '최근 1년' };
  const KIND_FROM = { gov: K.GOV, stat: K.STAT, news: K.NEWS, enc: K.ENC };

  // 도구가 실제로 하는 일 (질문을 받으면 이 내용만 설명한다)
  const HOW_TEXT = [
    '1. 기자님 말에서 확인할 주장을 "~이다" 문장으로 뽑습니다(조건은 빼지 않습니다).',
    '2. Tavily로 정부·공공기관 도메인(go.kr 등)을 먼저 검색하고, 이어서 일반 검색(최대 20건)으로 보충합니다. 범위를 말하면 그 범위(출처 종류, 지역 언론, 기간)로만 검색합니다.',
    '3. 검색된 주소를 정부·공공기관, 통계, 언론사, 백과사전, 기타, 블로그·커뮤니티로 분류하고, 이 순서로 정렬해 최대 5건을 근거로 씁니다.',
    '4. 근거가 0건이거나 블로그·커뮤니티뿐이면 AI에게 묻지 않고 "판단 유보"로 처리합니다.',
    '5. 그 외에는 Claude가 근거만 보고 6단계(사실, 대체로 사실, 절반의 사실, 대체로 사실 아님, 사실 아님, 판단 유보) 중 하나로 판정하고 이유에 근거 번호를 붙입니다. 6단계 밖의 답이거나 근거 번호가 없으면 "판단 유보"로 바꿉니다.',
    '한계: 검색 결과에 담긴 요약문만 읽고 기사 전문은 열어 보지 않습니다. 이름·기관·지역·날짜가 근거와 맞는지는 AI가 판단하며 코드가 따로 검사하지는 않습니다. 사진·영상 검증, 전화·현장 취재는 하지 않습니다.'
  ].join('\n');

  // ---------- 상태와 저장 ----------
  let messages = [];
  let busy = false;
  let pendingSensitive = null; // { text } 메모리에만 둔다(민감 정보가 저장소에 남지 않게)
  const uid = () => Math.random().toString(36).slice(2, 10);

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(LS_CHAT) || '[]');
      return Array.isArray(v) ? v.filter(m => m && m.id && m.type) : [];
    } catch { return []; }
  }
  function save() {
    if (messages.length > MAX_MSGS) messages = messages.slice(-MAX_MSGS);
    try { localStorage.setItem(LS_CHAT, JSON.stringify(messages)); }
    catch { /* 저장소가 막혔거나 가득 차도 대화는 계속한다 */ }
  }

  // ---------- 작은 도우미 ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function icon(name) { const i = el('i', 'ph ph-' + name); i.setAttribute('aria-hidden', 'true'); return i; }
  const list = () => $('cbList');
  function scrollDown() { const l = list(); l.scrollTop = l.scrollHeight; }
  function kstToday(offsetDays) {
    const d = new Date(Date.now() + (offsetDays || 0) * 86400000);
    return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  }
  function nowText() { return new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false }); }

  // ---------- 메시지 그리기 (외부 글자는 모두 textContent) ----------
  function renderOne(m) {
    const wrap = el('div', 'm ' + (m.role === 'user' ? 'user' : 'bot'));
    wrap.dataset.id = m.id;
    if (m.type === 'text') {
      wrap.append(el('div', 'bb', m.text));
    } else if (m.type === 'error') {
      wrap.append(el('div', 'bb err', m.text));
    } else if (m.type === 'claim') {
      wrap.classList.add('full');
      const box = el('div', 'claimbox');
      box.append(el('div', 'k', '확인할 주장'), el('div', 't', m.data.claim));
      if (m.data.inherited) box.append(el('span', 'inh', '앞 주장을 이어받음' + (m.data.note ? ': ' + m.data.note : '')));
      wrap.append(box);
    } else if (m.type === 'choices') {
      wrap.classList.add('full');
      wrap.append(el('div', 'bb', '확인할 만한 문장입니다. 판정할 문장을 눌러 주세요.'));
      m.data.sentences.forEach(sn => {
        const b = el('button', 'cb-pick', sn);
        b.type = 'button';
        b.addEventListener('click', () => { if (!busy) startCheck({ claim: sn, inherited: false, note: '' }, {}, '기본'); });
        wrap.append(b);
      });
    } else if (m.type === 'warn') {
      wrap.append(el('div', 'bb', m.text));
      if (pendingSensitive && pendingSensitive.id === m.id) {
        const row = el('div', 'cb-btns');
        const go = el('button', 'cb-btn red', '그래도 보내기'); go.type = 'button';
        const no = el('button', 'cb-btn', '취소'); no.type = 'button';
        go.addEventListener('click', () => { const t = pendingSensitive.text; pendingSensitive = null; renderAll(); sendText(t, true); });
        no.addEventListener('click', () => { pendingSensitive = null; renderAll(); addMsg({ role: 'bot', type: 'text', text: '보내지 않았습니다.' }); });
        row.append(go, no);
        wrap.append(row);
      }
    } else if (m.type === 'keys') {
      wrap.append(el('div', 'bb', m.text));
      const b = el('button', 'cb-btn red', '키 입력하러 가기'); b.type = 'button';
      b.addEventListener('click', () => { closeWin(); window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => $('tavilyKey').focus(), 300); });
      wrap.append(b);
    } else if (m.type === 'result') {
      wrap.classList.add('full');
      wrap.append(renderResult(m.data));
    }
    return wrap;
  }

  function renderResult(d) {
    const card = el('div', 'rc');
    card.dataset.v = String(Math.max(0, FC.VERDICTS.indexOf(d.verdict)));
    card.append(el('div', 'lbl', '확인한 주장'), el('div', 'claim', d.claim));
    if (d.inherited) card.append(el('span', 'inh', '앞 주장을 이어받음' + (d.note ? ': ' + d.note : '')));
    const vrow = el('div', 'vrow');
    vrow.append(el('span', 'vb', d.verdict));
    card.append(vrow);
    card.append(el('div', 'sum', d.summary), el('p', 'rsn', d.reason));
    card.append(el('div', 'scope', '검색 범위: ' + d.scopeText));

    if (d.nextChecks && d.nextChecks.length) {
      card.append(el('div', 'sub', '다음에 확인할 곳'));
      const ul = el('ul', 'next');
      d.nextChecks.forEach(n => ul.append(el('li', '', n.where + (n.material ? ' / ' + n.material : ''))));
      card.append(ul, el('div', 'note', 'AI의 참고 제안입니다. 실제 부서 이름과 연락처는 직접 확인해 주세요.'));
    }

    if (d.evidence && d.evidence.length) {
      card.append(el('div', 'sub', '근거'));
      const ol = el('ol');
      d.evidence.forEach((e, i) => {
        const n = i + 1;
        const li = el('li');
        const l1 = el('div', 'l1');
        l1.append(el('span', 'n', '[' + n + ']'), el('span', 'kind ' + (FC.KIND_CLASS[e.kind] || 'k-etc'), e.kind));
        if ((d.used || []).includes(n)) l1.append(el('span', 'used', '판정에 사용'));
        const dt = el('div', 'dt');
        dt.append(document.createTextNode((e.date || '날짜 정보 없음') + ' / '));
        const href = FC.safeHttpUrl(e.url);
        if (href) {
          const a = el('a', '', e.url);
          a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
          dt.append(a);
        } else dt.append(document.createTextNode(e.url || '주소 없음'));
        li.append(l1, el('div', 'ti', e.title), dt);
        ol.append(li);
      });
      card.append(ol);
    }

    const acts = el('div', 'acts');
    const cp = el('button', 'cb-btn', '기사용 문안 복사'); cp.type = 'button';
    cp.prepend(icon('copy'), document.createTextNode(' '));
    cp.addEventListener('click', async () => {
      const ok = await copyText(resultCopyText(d));
      cp.lastChild.textContent = ok ? '복사했습니다' : '복사하지 못했습니다';
      setTimeout(() => { cp.lastChild.textContent = '기사용 문안 복사'; }, 2000);
    });
    acts.append(cp);
    card.append(acts);
    return card;
  }

  function renderAll() {
    const l = list();
    l.replaceChildren();
    messages.forEach(m => l.append(renderOne(m)));
    scrollDown();
  }
  function addMsg(m) {
    m.id = m.id || uid();
    m.ts = Date.now();
    messages.push(m);
    save();
    const node = renderOne(m);
    list().append(node);
    scrollDown();
    return m;
  }

  // ---------- 복사·내려받기 ----------
  function resultCopyText(d) {
    const lines = [
      '확인한 주장: ' + d.claim,
      '판정: ' + d.verdict,
      '요약: ' + d.summary,
      '검색 범위: ' + d.scopeText,
      '근거:'
    ];
    if (d.evidence && d.evidence.length) {
      d.evidence.forEach((e, i) => lines.push('[' + (i + 1) + '] ' + e.title + ' (' + e.kind + ', ' + (e.date || '날짜 정보 없음') + ') ' + e.url));
    } else lines.push('(찾은 근거 없음)');
    lines.push('확인 시각: ' + new Date(d.checkedAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false }));
    return lines.join('\n');
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch { /* 아래 방법으로 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch { return false; }
  }
  function transcript() {
    const out = ['취재 도우미 대화 (' + nowText() + ' 내려받음)', ''];
    messages.forEach(m => {
      const who = m.role === 'user' ? '기자' : '도우미';
      if (m.type === 'text' || m.type === 'error' || m.type === 'warn' || m.type === 'keys') out.push(who + ': ' + m.text);
      else if (m.type === 'claim') out.push(who + ' (확인할 주장): ' + m.data.claim + (m.data.inherited ? ' [앞 주장을 이어받음: ' + m.data.note + ']' : ''));
      else if (m.type === 'choices') out.push(who + ' (확인할 만한 문장): ' + m.data.sentences.join(' | '));
      else if (m.type === 'result') out.push(who + ' (판정 결과)\n' + resultCopyText(m.data));
      out.push('');
    });
    return out.join('\n');
  }
  function downloadChat() {
    const blob = new Blob([transcript()], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    const stamp = kstToday(0).replace(/-/g, '') + '-' + new Date().toLocaleTimeString('sv-SE', { timeZone: 'Asia/Seoul' }).slice(0, 5).replace(':', '');
    a.href = URL.createObjectURL(blob);
    a.download = '취재도우미-대화-' + stamp + '.txt';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- 진행 단계 ----------
  let stepsEl = null;
  const STEP_NAMES = ['주장 살펴보기', '자료 찾기', '판정'];
  function showSteps(active, sub) {
    if (!stepsEl) { stepsEl = el('div', 'steps'); stepsEl.setAttribute('role', 'status'); list().append(stepsEl); }
    stepsEl.replaceChildren();
    const ol = el('ol');
    STEP_NAMES.forEach((n, i) => {
      const li = el('li', i + 1 < active ? 'done' : i + 1 === active ? 'on' : '', (i + 1) + '. ' + n + (i + 1 === active ? '…' : ''));
      ol.append(li);
    });
    stepsEl.append(ol);
    if (sub) stepsEl.append(el('div', 'sm', sub));
    scrollDown();
  }
  function hideSteps() { if (stepsEl) { stepsEl.remove(); stepsEl = null; } }
  function onStatus(msg) {
    const step = /Tavily/.test(msg) ? 2 : /살펴보는/.test(msg) ? 1 : 3;
    showSteps(step, msg);
  }

  // ---------- 민감 정보 ----------
  function detectSensitive(t) {
    const hits = [];
    if (/\d{6}\s?-\s?[1-4]\d{6}/.test(t)) hits.push('주민등록번호');
    if (/01[016-9][-.\s]?\d{3,4}[-.\s]?\d{4}/.test(t) || /\b0\d{1,2}[-.\s]\d{3,4}[-.\s]\d{4}\b/.test(t)) hits.push('전화번호');
    if (/[\w.+-]+@[\w-]+\.[\w.-]+/.test(t)) hits.push('이메일');
    if (/엠바고/.test(t)) hits.push('엠바고');
    return hits;
  }

    const arr = beforeIdx == null ? messages : messages.slice(0, beforeIdx);
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i].type === 'result') return arr[i].data;

      '',

  function scopeFrom(r) {
    const scope = {};
    const parts = [];
    const kinds = (r.scope_kinds || []).map(k => KIND_FROM[k]).filter(Boolean);
    if (kinds.length) { scope.kinds = kinds; parts.push(kinds.join('·') + ' 자료로만'); }
    if (r.region && REGIONS[r.region]) {
      scope.domains = REGIONS[r.region].domains;
      parts.push(r.region + ' 지역 언론(' + REGIONS[r.region].names + ')으로만');
    }
    if (r.time_range && TIME_LABEL[r.time_range]) { scope.timeRange = r.time_range; parts.push(TIME_LABEL[r.time_range] + ' 기사·자료로만'); }
    return { scope, text: parts.length ? parts.join(', ') : '범위 지정 없음(정부·공공기관 자료를 먼저 찾고 일반 검색으로 보충)' };
  }

  // ---------- 검색과 판정 ----------
  async function startCheck(claimInfo, scopeInfo, scopeTextOverride) {
    const { tavily, claude } = FC.getKeys();
    addMsg({ role: 'bot', type: 'claim', data: claimInfo });
    const sc = scopeInfo && scopeInfo.scope ? scopeInfo : { scope: {}, text: '범위 지정 없음(정부·공공기관 자료를 먼저 찾고 일반 검색으로 보충)' };
    busy = true; setBusy();
    try {
      showSteps(2);
      const { evidence, result } = await FC.judge(claimInfo.claim, tavily, claude, sc.scope, onStatus);
      let nextChecks = [];
      if (result.verdict === FC.HOLD) {
        try {
          showSteps(3, '다음에 확인할 곳을 찾는 중…');
          const prompt = [
            '지역 언론사 기자가 아래 주장을 확인하려 했지만 판단을 유보했습니다. 다음에 확인할 곳을 1~2개 제안하세요.',
            '각 항목은 where(기관·부서 단위)와 material(찾아볼 자료 이름)로 씁니다.',
            '전화번호, 담당자 이름, 웹주소는 쓰지 마세요. 주장에 지역이 있으면 그 지역 자치단체의 해당 분야 담당 부서처럼 일반적인 체계로 쓰고, 확신이 없으면 "해당 자치단체 정보공개 포털"처럼 일반 경로로 쓰세요. 주장의 사실 여부는 판단하지 마세요.',
            '',
            '[주장]', claimInfo.claim, '', '[유보 이유]', result.reason
          ].join('\n');
          const { data } = await FC.askClaude(prompt, claude, SUGGEST_TOOL, onStatus);
          const o = FC.parseClaudeResult(data);
          if (o && Array.isArray(o.items)) nextChecks = o.items.slice(0, 2).map(x => ({ where: String(x.where || '').trim(), material: String(x.material || '').trim() })).filter(x => x.where);
        } catch { /* 제안이 없어도 판정 결과는 보여 준다 */ }
      }
      hideSteps();
      addMsg({
        role: 'bot', type: 'result',
        data: {
          claim: claimInfo.claim, inherited: !!claimInfo.inherited, note: claimInfo.note || '',
          verdict: result.verdict, summary: result.summary, reason: result.reason, used: result.used || [],
          evidence: evidence.map(e => ({ title: e.title, url: e.url, date: e.date, kind: e.kind, content: String(e.content || '').slice(0, EVID_CONTENT_CAP) })),
          scopeText: sc.text, checkedAt: Date.now(), nextChecks
        }
      });
    } catch (e) {
      hideSteps();
      addMsg({ role: 'bot', type: 'error', text: e instanceof FC.UserError ? e.message : '알 수 없는 오류가 발생했습니다: ' + (e && e.message ? e.message : e) });
    } finally {
      busy = false; setBusy();
    }
  }

  function sanitizeAbout(reply, last) {
    const nums = [...reply.matchAll(/\[(\d+)\]/g)].map(m => Number(m[1]));
    if (nums.some(n => n < 1 || n > last.evidence.length)) return '근거 번호를 확인하지 못해 답을 보류합니다. 다시 물어봐 주세요.';
    if (!nums.length) return reply + '\n(근거 번호가 없는 답입니다. 근거 목록을 직접 확인해 주세요.)';
    return reply;
  }

  // ---------- 보내기 ----------
  function setBusy() {
    $('cbSend').disabled = busy;
    $('cbInput').disabled = busy;
    if (!busy) $('cbInput').focus();
  }

  async function sendText(text, skipSensitive) {
    text = text.trim();
    if (!text || busy) return;
    if (!skipSensitive) {
      const hits = detectSensitive(text);
      if (hits.length) {
        const w = addMsg({ role: 'bot', type: 'warn', text: '입력한 글에 민감해 보이는 정보(' + hits.join(', ') + ')가 있습니다. 이 내용은 AI 서비스(Anthropic)와 검색 서비스(Tavily)로 전송될 수 있습니다. 그래도 보낼까요?' });
        pendingSensitive = { id: w.id, text };
        renderAll();
        return;
      }
    }
    const { tavily, claude } = FC.getKeys();
    const history = messages.slice();
    const last = lastResult();
    addMsg({ role: 'user', type: 'text', text });
    if (!tavily || !claude) {
      addMsg({ role: 'bot', type: 'keys', text: (!tavily && !claude ? 'Tavily 키와 Claude 키가' : !tavily ? 'Tavily 키가' : 'Claude 키가') + ' 없습니다. 화면 위쪽에서 키를 넣고 "키 저장"을 누르면 챗봇도 같은 키를 씁니다.' });
      return;
    }
    busy = true; setBusy();
    try {
      showSteps(1);
      const { data } = await FC.askClaude(buildRouterPrompt(text, history, last), claude, ROUTE_TOOL, onStatus);
      const r = FC.parseClaudeResult(data);
      hideSteps();
      if (!r || !r.intent) { addMsg({ role: 'bot', type: 'error', text: 'AI의 답을 해석하지 못했습니다. 다시 말씀해 주세요.' }); return; }
      if (r.intent === 'check' && String(r.claim || '').trim()) {
        const info = { claim: String(r.claim).trim(), inherited: r.inherited === true && !!last, note: String(r.inherited_note || '').trim() };
        const sc = scopeFrom(r);
        busy = false;
        await startCheck(info, sc);
        return;
      }
      if (r.intent === 'article' && Array.isArray(r.sentences) && r.sentences.length) {
        const sn = r.sentences.map(x => String(x || '').trim()).filter(Boolean).slice(0, 5);
        if (sn.length) { addMsg({ role: 'bot', type: 'choices', data: { sentences: sn } }); return; }
      }
      if (r.intent === 'about_result') {
        if (!last) { addMsg({ role: 'bot', type: 'text', text: '아직 판정한 결과가 없습니다. 확인하고 싶은 주장을 먼저 말씀해 주세요.' }); return; }
        addMsg({ role: 'bot', type: 'text', text: sanitizeAbout(String(r.reply || '').trim() || '근거에서 찾을 수 있는 답이 없습니다.', last) });
        return;
      }
      addMsg({ role: 'bot', type: 'text', text: String(r.reply || '').trim() || '무엇을 확인해 드릴까요?' });
    } catch (e) {
      hideSteps();
      addMsg({ role: 'bot', type: 'error', text: e instanceof FC.UserError ? e.message : '알 수 없는 오류가 발생했습니다: ' + (e && e.message ? e.message : e) });
    } finally {
      busy = false; setBusy();
    }
  }

  // ---------- 열기, 닫기, 크기 ----------
  function openWin() {
    $('cbWin').hidden = false;
    $('cbFab').setAttribute('aria-expanded', 'true');
    scrollDown();
    $('cbInput').focus();
  }
  function closeWin() {
    $('cbWin').hidden = true;
    $('cbFab').setAttribute('aria-expanded', 'false');
  }
  $('cbFab').addEventListener('click', () => { $('cbWin').hidden ? openWin() : closeWin(); });
  $('cbClose').addEventListener('click', closeWin);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('cbWin').hidden) { closeWin(); $('cbFab').focus(); } });

  $('cbNew').addEventListener('click', () => {
    if (busy) return;
    if (messages.length && !window.confirm('지금까지의 대화를 지우고 새로 시작할까요? (필요하면 먼저 내려받으세요)')) return;
    messages = []; pendingSensitive = null; save(); greet(); renderAll();
  });
  $('cbDl').addEventListener('click', downloadChat);

  $('cbForm').addEventListener('submit', e => {
    e.preventDefault();
    const t = $('cbInput').value;
    if (!t.trim() || busy) return;
    $('cbInput').value = ''; autosize();
    sendText(t, false);
  });
  $('cbInput').addEventListener('keydown', e => {
    // 한글 조합 중에는 Enter 를 보내기로 쓰지 않는다.
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $('cbForm').requestSubmit(); }
  });
  function autosize() { const t = $('cbInput'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('cbInput').addEventListener('input', autosize);

  // 왼쪽 위 모서리를 끌어 크기 바꾸기 (창이 오른쪽 아래에 붙어 있어서 왼쪽 위로 늘어난다)
  (function resizer() {
    const win = $('cbWin'), grip = $('cbGrip');
    try {
      const sz = JSON.parse(localStorage.getItem(LS_SIZE) || 'null');
      if (sz && sz.w && sz.h) { win.style.width = sz.w + 'px'; win.style.height = sz.h + 'px'; }
    } catch { /* 기본 크기 */ }
    let start = null;
    grip.addEventListener('pointerdown', e => {
      start = { x: e.clientX, y: e.clientY, w: win.offsetWidth, h: win.offsetHeight };
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener('pointermove', e => {
      if (!start) return;
      const w = Math.max(320, Math.min(window.innerWidth - 24, start.w + (start.x - e.clientX)));
      const h = Math.max(420, Math.min(window.innerHeight - 116, start.h + (start.y - e.clientY)));
      win.style.width = w + 'px'; win.style.height = h + 'px';
    });
    const end = () => {
      if (!start) return;
      start = null;
      try { localStorage.setItem(LS_SIZE, JSON.stringify({ w: win.offsetWidth, h: win.offsetHeight })); } catch { /* 무시 */ }
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  })();

  function greet() {
    addMsg({
      role: 'bot', type: 'text',
      text: '안녕하세요, 취재 도우미입니다. 이런 일을 도와드립니다.\n- 주장이 사실인지 확인 ("대구시가 올해 청년 월세 지원을 늘렸어?")\n- 방금 판정의 이유와 반박 근거 설명\n- 기사나 보도자료 문단에서 확인할 문장 고르기\n- "정부 자료로만", "최근 한 달 기사로"처럼 범위를 정해 검색'
    });
  }

  messages = load();
  if (!messages.length) greet();
  renderAll();
})();

</script>
