<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팩트체크 도구</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1b1f27; --sub: #5a6270; --line: #d9dde4;
    --accent: #1f4fd8; --err: #d00000;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 30px; margin: 8px 0 16px; }
  h2 { font-size: 22px; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  label { display: block; font-weight: 700; margin: 12px 0 4px; }
  input[type=password], input[type=text], textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  button { font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 22px; padding: 14px 32px; }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .hint { color: var(--sub); font-size: 16px; margin-top: 8px; }
  #error { color: var(--err); font-weight: 700; margin-top: 14px; white-space: pre-wrap; }
  #status { color: var(--sub); margin-top: 14px; }
  .badge { display: inline-block; font-size: 38px; font-weight: 800; padding: 10px 28px; border-radius: 14px; color: #fff; margin: 4px 0 12px; }
  .v-사실 { background: #1b8a3a; }
  .v-대체로-사실 { background: #6aa51f; }
  .v-절반의-사실 { background: #e0a800; color: #1b1f27; }
  .v-대체로-사실-아님 { background: #e8710a; }
  .v-사실-아님 { background: #c62828; }
  .v-판단-유보 { background: #6b7280; }
  .summary { font-size: 24px; font-weight: 700; margin: 4px 0 8px; }
  .reason { white-space: pre-wrap; }
  .ev { border-top: 1px solid var(--line); padding: 14px 0; }
  .ev:first-child { border-top: 0; }
  .ev .no { font-weight: 800; color: var(--accent); }
  .ev .meta { color: var(--sub); font-size: 17px; }
  .ev .body { white-space: pre-wrap; margin-top: 6px; font-size: 18px; }
  .ev a { word-break: break-all; }
  .cand { display: block; width: 100%; text-align: left; margin-top: 10px; font-weight: 600; line-height: 1.5; }
  .cand:hover { border-color: var(--accent); background: #f0f5ff; }
  .kind { display: inline-block; font-size: 15px; font-weight: 700; border-radius: 6px; padding: 2px 8px; margin-right: 8px; color: #fff; vertical-align: 2px; }
  .k-gov { background: #1f4fd8; } .k-stat { background: #0f766e; } .k-news { background: #374151; }
  .k-enc { background: #7c3aed; } .k-etc { background: #6b7280; } .k-comm { background: #c62828; }
  .used { font-size: 15px; font-weight: 700; background: #e7efff; color: var(--accent); border-radius: 6px; padding: 2px 8px; margin-left: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>팩트체크 도구</h1>

  <section class="card" aria-label="키 설정">
    <h2>API 키</h2>
    <label for="tavilyKey">Tavily 키</label>
    <input id="tavilyKey" type="password" autocomplete="off" placeholder="tvly-...">
    <label for="claudeKey">Claude 키</label>
    <input id="claudeKey" type="password" autocomplete="off" placeholder="sk-ant-...">
    <div class="row">
      <button id="saveKeys" type="button">키 저장</button>
      <button id="clearKeys" type="button">키 지우기</button>
    </div>
    <div class="hint" id="keyMsg">키는 이 브라우저에만 저장되며 파일에는 적히지 않습니다.</div>
  </section>

  <section class="card" aria-label="주장 입력">
    <label for="claim" style="margin-top:0">검증할 주장 (한 문장)</label>
    <textarea id="claim" placeholder="예) 2025년 ○○시는 청년 월세 지원금을 20만 원으로 올렸다."></textarea>
    <div class="row"><button id="go" class="primary" type="button">검증하기</button></div>
    <div id="status" hidden></div>
    <div id="error" role="alert" hidden></div>
  </section>

  <section class="card" id="clarify" hidden>
    <h2>주장이 모호합니다. 어느 쪽으로 검증할까요?</h2>
    <div id="clarifyWhy" class="hint" style="font-size:18px"></div>
    <div id="clarifyList"></div>
    <div class="row"><button id="useOriginal" type="button">원래 문장 그대로 검증하기</button></div>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div id="badge" class="badge"></div>
    <div id="summary" class="summary"></div>
    <div id="reason" class="reason"></div>
  </section>

  <section class="card" id="evidence" hidden>
    <h2>찾은 근거</h2>
    <div id="evList"></div>
  </section>
</main>

<script>
(() => {
  'use strict';

  // 모델 순서: 429(한도 초과)가 오면 다음 모델로 바로 바꿔 다시 시도한다.
  const MODELS = ['claude-sonnet-5-5', 'claude-haiku-5-5'];
  const VERDICTS = ['사실', '대체로 사실', '절반의 사실', '대체로 사실 아님', '사실 아님', '판단 유보'];
  const HOLD = '판단 유보';
  const RETRY_503_MAX = 2;
  const RETRY_503_WAIT_MS = 3000;
  const MAX_RESULTS = 5;
  const FETCH_RESULTS = 20; // 허용 출처만 남기고 5건을 채우려고 넉넉히 받는다

  // 출처 종류 분류 (도메인 기준). 필요하면 목록에 도메인을 추가한다.
  const K_GOV = '정부·공공기관', K_STAT = '통계', K_NEWS = '언론사', K_ENC = '백과사전', K_COMM = '블로그·커뮤니티', K_ETC = '기타';
  const KIND_RANK = { [K_GOV]: 0, [K_STAT]: 1, [K_NEWS]: 2, [K_ENC]: 3, [K_ETC]: 4, [K_COMM]: 5 };
  const KIND_CLASS = { [K_GOV]: 'k-gov', [K_STAT]: 'k-stat', [K_NEWS]: 'k-news', [K_ENC]: 'k-enc', [K_ETC]: 'k-etc', [K_COMM]: 'k-comm' };
  const GOV_SEARCH = ['*.go.kr', 'korea.kr', 'mil.kr', 'bok.or.kr', 'kosis.kr']; // 1차 검색에서 먼저 찾을 정부·공공 도메인
  const DOMAINS = {
    [K_STAT]: ['kosis.kr', 'stat.go.kr', 'index.go.kr', 'data.go.kr', 'ecos.bok.or.kr', 'oecd.org', 'worldbank.org'],
    [K_GOV]: ['go.kr', 'korea.kr', 'mil.kr', 'bok.or.kr', 'gov.kr', 'who.int', 'un.org'],
    [K_ENC]: ['wikipedia.org', 'namu.wiki', 'encykorea.aks.ac.kr', 'terms.naver.com', 'doopedia.co.kr', 'britannica.com'],
    [K_COMM]: [
      'blog.naver.com', 'cafe.naver.com', 'blog.daum.net', 'cafe.daum.net', 'tistory.com', 'brunch.co.kr', 'velog.io', 'medium.com', 'blogspot.com',
      'instagram.com', 'facebook.com', 'twitter.com', 'x.com', 'threads.net', 'youtube.com', 'tiktok.com',
      'reddit.com', 'dcinside.com', 'fmkorea.com', 'clien.net', 'pann.nate.com', 'quora.com', 'ruliweb.com', 'theqoo.net', 'instiz.net'
    ],
    [K_NEWS]: [
      'yna.co.kr', 'yonhapnewstv.co.kr', 'newsis.com', 'news1.kr', 'kbs.co.kr', 'mbc.co.kr', 'imbc.com', 'sbs.co.kr', 'jtbc.co.kr',
      'ytn.co.kr', 'ebs.co.kr', 'tvchosun.com', 'channela.com', 'mbn.co.kr', 'nocutnews.co.kr',
      'chosun.com', 'joongang.co.kr', 'donga.com', 'hani.co.kr', 'khan.co.kr', 'hankookilbo.com', 'seoul.co.kr', 'munhwa.com',
      'segye.com', 'kmib.co.kr', 'mk.co.kr', 'hankyung.com', 'sedaily.com', 'edaily.co.kr', 'mt.co.kr', 'fnnews.com', 'asiae.co.kr',
      'heraldcorp.com', 'ohmynews.com', 'pressian.com', 'mediatoday.co.kr', 'newspim.com', 'etnews.com', 'kukinews.com', 'dt.co.kr',
      'busan.com', 'kookje.co.kr', 'imaeil.com', 'yeongnam.com', 'kwnews.co.kr', 'kado.net', 'jbnews.com', 'cctoday.co.kr',
      'daejonilbo.com', 'jeonmae.co.kr', 'kjdaily.com', 'jjan.kr', 'jejunews.com', 'halla.com', 'ulsanpress.net', 'kyeongin.com',
      'kgnews.co.kr', 'joongboo.com', 'kihoilbo.co.kr', 'ggilbo.com', 'incheonilbo.com', 'idomin.com', 'knnews.co.kr', 'gnnews.co.kr',
      'news.naver.com', 'n.news.naver.com', 'v.daum.net',
      'reuters.com', 'apnews.com', 'bbc.com', 'bbc.co.uk', 'nytimes.com', 'washingtonpost.com', 'bloomberg.com', 'cnn.com'
    ]
  };
  function hostMatch(host, list) { return list.some(d => host === d || host.endsWith('.' + d)); }
  function classify(u) {
    let host;
    try { host = new URL(u).hostname.toLowerCase(); } catch { return K_ETC; }
    if (hostMatch(host, DOMAINS[K_COMM]) || /^(blog|cafe)\./.test(host)) return K_COMM;
    if (hostMatch(host, DOMAINS[K_STAT])) return K_STAT;
    if (hostMatch(host, DOMAINS[K_GOV]) || /\.gov(\.[a-z]{2})?$/.test(host)) return K_GOV;
    if (hostMatch(host, DOMAINS[K_ENC])) return K_ENC;
    if (hostMatch(host, DOMAINS[K_NEWS])) return K_NEWS;
    return K_ETC;
  }

  const LS_T = 'factcheck.tavilyKey';
  const LS_G = 'factcheck.claudeKey';

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- 키 보관 (이 브라우저의 localStorage에만) ----------
  function storeGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
  function storeSet(k, v) { localStorage.setItem(k, v); }
  function storeDel(k) { localStorage.removeItem(k); }

  function keyMsg(text, isErr) {
    const el = $('keyMsg');
    el.textContent = text;
    el.style.color = isErr ? 'var(--err)' : '';
  }

  $('tavilyKey').value = storeGet(LS_T);
  $('claudeKey').value = storeGet(LS_G);

  $('saveKeys').addEventListener('click', () => {
    try {
      storeSet(LS_T, $('tavilyKey').value.trim());
      storeSet(LS_G, $('claudeKey').value.trim());
      keyMsg('키를 이 브라우저에 저장했습니다.');
    } catch {
      keyMsg('이 브라우저가 저장을 막고 있습니다(시크릿 창 등). 지금 화면에서는 입력한 키로 검증할 수 있지만 다음에 열면 다시 입력해야 합니다.', true);
    }
  });

  $('clearKeys').addEventListener('click', () => {
    try { storeDel(LS_T); storeDel(LS_G); } catch { /* 무시 */ }
    $('tavilyKey').value = '';
    $('claudeKey').value = '';
    keyMsg('이 브라우저에 저장된 키를 지웠습니다.');
  });

  // ---------- 화면 도우미 ----------
  function showError(msg) {
    const el = $('error');
    el.textContent = msg;
    el.hidden = false;
  }
  function clearOutput() {
    $('error').hidden = true; $('error').textContent = '';
    $('result').hidden = true;
    $('clarify').hidden = true;
    $('evidence').hidden = true;
    $('evList').replaceChildren();
  }
  function setStatus(msg) {
    const el = $('status');
    el.textContent = msg;
    el.hidden = !msg;
  }

  class UserError extends Error {}

  // ---------- Tavily ----------
  async function tavilyRaw(claim, key, extra) {
    let res;
    try {
      res = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify(Object.assign({ query: claim, search_depth: 'basic', include_answer: false }, extra))
      });
    } catch {
      throw new UserError('Tavily에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 브라우저가 이 요청을 막고 있는지(CORS) 확인해 주세요.');
    }
    const fail = (msg) => { const e = new UserError(msg); e.status = res.status; return e; };
    if (res.status === 401 || res.status === 403) throw fail('Tavily 키가 올바르지 않거나 권한이 없습니다. (오류 ' + res.status + ')');
    if (res.status === 429) throw fail('Tavily 사용 한도를 넘었습니다. 잠시 뒤 다시 시도해 주세요. (오류 429)');
    if (!res.ok) throw fail('Tavily 검색에 실패했습니다. (오류 ' + res.status + ')');
    let data;
    try { data = await res.json(); } catch { throw new UserError('Tavily 응답을 읽지 못했습니다.'); }
    return Array.isArray(data.results) ? data.results : [];
  }

  // 정부·공공기관 도메인에서 먼저 찾고, 일반 검색으로 보충한 뒤 출처 종류 순(정부 → 통계 → 언론 → 백과 → 기타 → 블로그)으로 5건을 고른다.
  async function searchTavily(claim, key) {
    let govList = [];
    try {
      govList = await tavilyRaw(claim, key, { max_results: 10, include_domains: GOV_SEARCH });
    } catch (e) {
      if (e && (e.status === 401 || e.status === 403 || e.status === 429)) throw e;
      govList = []; // 정부 도메인 지정 검색이 실패해도 일반 검색으로 계속한다.
    }
    const general = await tavilyRaw(claim, key, { max_results: FETCH_RESULTS });
    const seen = new Set();
    const merged = [];
    for (const r of govList.concat(general)) {
      const url = String((r && r.url) || '');
      if (!url || seen.has(url)) continue;
      seen.add(url);
      merged.push({
        title: String(r.title || '(제목 없음)'),
        url,
        date: String(r.published_date || r.publishedDate || ''),
        content: String(r.content || ''),
        kind: classify(url)
      });
    }
    merged.sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind]); // 같은 종류 안에서는 검색 순서 유지
    return merged.slice(0, MAX_RESULTS);
  }

  // ---------- Claude ----------
  function buildPrompt(claim, evidence) {
    const ev = evidence.map((e, i) =>
      `[근거 ${i + 1}]\n출처 종류: ${e.kind}\n제목: ${e.title}\n날짜: ${e.date || '날짜 정보 없음'}\n주소: ${e.url}\n내용: ${e.content}`
    ).join('\n\n');
    return [
      '당신은 지역 언론사의 팩트체크 보조자입니다. 아래 [주장]을 오직 [근거]만 보고 판정하세요.',
      '',
      '규칙:',
      '1. 근거에 없는 내용을 지어내거나 당신이 아는 지식으로 보충하지 마세요.',
      '2. 주장 속 사람 이름, 기관, 지역, 날짜가 근거와 정확히 맞을 때만 그 근거를 쓰세요. 이름 일부만 같거나 다른 지역·기관·시점이면 관련 없는 근거로 보고 쓰지 마세요.',
      '3. 주장과 직접 관련된 근거가 하나도 없으면 판정은 "판단 유보"입니다.',
      '4. 판정은 다음 6개 중 정확히 하나만 쓰세요: ' + VERDICTS.join(' / '),
      '5. 이유의 각 문장 끝에 근거 번호를 [1], [2] 형태로 붙이세요.',
      '6. used 에는 실제로 판정에 쓴 근거 번호(정수)만 넣으세요.',
      '7. 정부·공공기관, 통계 자료를 가장 우선하고 언론사, 백과사전 순으로 신뢰하세요. 블로그·커뮤니티 글은 근거로 인정하지 말고, 공식 자료나 언론 기사와 어긋나면 그쪽을 따르세요. 블로그·커뮤니티 글만으로는 판정하지 마세요.',
      '',
      '반드시 report_verdict 도구를 호출해 verdict(판정), summary(한 줄 요약), reason(이유), used(사용한 근거 번호들)를 답하세요.',
      '',
      '[주장]',
      claim,
      '',
      '[근거]',
      ev
    ].join('\n');
  }

  const VERDICT_TOOL = {
    name: 'report_verdict',
    label: '판정하는',
    description: '팩트체크 판정을 보고한다.',
    input_schema: {
      type: 'object',
      properties: {
        verdict: { type: 'string', enum: VERDICTS },
        summary: { type: 'string' },
        reason: { type: 'string' },
        used: { type: 'array', items: { type: 'integer' } }
      },
      required: ['verdict', 'summary', 'reason', 'used']
    }
  };

  async function callClaudeOnce(model, key, prompt, tool) {
    try {
      return await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          max_tokens: 1500,
          messages: [{ role: 'user', content: prompt }],
          tools: [{ name: tool.name, description: tool.description, input_schema: tool.input_schema }]
        })
      });
    } catch {
      throw new UserError('Claude에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 브라우저가 이 요청을 막고 있는지(CORS) 확인해 주세요.');
    }
  }

  async function errDetail(res) {
    try { const j = await res.json(); return j && j.error && j.error.message ? ' — ' + j.error.message : ''; } catch { return ''; }
  }

  // 429(한도 초과) → 다음 모델로 즉시 교체, 503·529(사용량 많음) → 3초 쉬고 같은 모델로 최대 2번 재시도
  async function askClaude(prompt, key, tool) {
    for (let m = 0; m < MODELS.length; m++) {
      const model = MODELS[m];
      let retry = 0;
      for (;;) {
        setStatus('Claude(' + model + ')가 ' + tool.label + ' 중…' + (retry ? ' (재시도 ' + retry + '/' + RETRY_503_MAX + ')' : ''));
        const res = await callClaudeOnce(model, key, prompt, tool);
        if (res.ok) {
          let data;
          try { data = await res.json(); } catch { throw new UserError('Claude 응답을 읽지 못했습니다.'); }
          return { data, model };
        }
        if (res.status === 429) break; // 다음 모델로
        if (res.status === 503 || res.status === 529) {
          if (retry < RETRY_503_MAX) { retry++; await sleep(RETRY_503_WAIT_MS); continue; }
          throw new UserError('Claude 사용량이 많아 응답하지 못했습니다. 3초 간격으로 ' + RETRY_503_MAX + '번 다시 시도했지만 실패했습니다. 잠시 뒤 다시 눌러 주세요. (오류 ' + res.status + ', 모델 ' + model + ')');
        }
        const detail = await errDetail(res);
        if (res.status === 401 || res.status === 403) {
          throw new UserError('Claude 키가 올바르지 않거나 권한이 없습니다. (오류 ' + res.status + ')' + detail);
        }
        if (res.status === 404) {
          throw new UserError('Claude 모델 "' + model + '"을(를) 찾을 수 없습니다. 모델 이름을 확인해 주세요. (오류 404)' + detail);
        }
        throw new UserError('Claude 호출에 실패했습니다. (오류 ' + res.status + ', 모델 ' + model + ')' + detail);
      }
    }
    throw new UserError('Claude 사용 한도를 넘었습니다. 모델 ' + MODELS.join(', ') + ' 모두 한도 초과(429)입니다. 잠시 뒤 다시 시도해 주세요.');
  }

  function parseClaudeResult(data) {
    const blocks = data && Array.isArray(data.content) ? data.content : [];
    const tu = blocks.find(b => b && b.type === 'tool_use' && b.input && typeof b.input === 'object');
    if (tu) return tu.input;
    // 도구 대신 글로 답했을 때: 글 속 JSON 을 꺼내 본다.
    const text = blocks.filter(b => b && b.type === 'text').map(b => b.text || '').join('');
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch { /* 아래에서 null */ } }
    return null;
  }

  // ---------- 모호한 주장 점검 ----------
  const CLARIFY_TOOL = {
    name: 'report_clarity',
    label: '주장을 점검하는',
    description: '주장이 검증 가능한 만큼 구체적인지 보고한다.',
    input_schema: {
      type: 'object',
      properties: {
        ambiguous: { type: 'boolean' },
        missing: { type: 'array', items: { type: 'string' } },
        candidates: { type: 'array', items: { type: 'string' } }
      },
      required: ['ambiguous', 'missing', 'candidates']
    }
  };

  function buildClarifyPrompt(claim) {
    return [
      '당신은 지역 언론사의 팩트체크 보조자입니다. 아래 [주장]을 검색으로 검증하기 전에, 검증할 수 있을 만큼 구체적인지 점검하세요.',
      '',
      '모호하다고 볼 기준: 비교·평가의 기준이 없음("많다", "늘었다", "최고"), 기간이 없음("최근", "요즘"), 지역·범위가 없음("우리 지역", "전국인지 시·군인지 불명"), 주체(누가·어느 기관)가 불분명함.',
      '',
      '규칙:',
      '1. 사람 이름, 기관, 지역, 날짜, 숫자가 이미 충분히 구체적이면 ambiguous 는 false 이고 candidates 는 빈 배열입니다. 사소한 표현 차이는 모호한 것이 아닙니다.',
      '2. ambiguous 가 true 이면 missing 에 빠진 것(기준, 기간, 지역, 주체 중)을 적고, candidates 에 검증할 수 있게 다듬은 한 문장 후보를 2~3개 쓰세요.',
      '3. 후보는 원래 주장의 뜻을 유지하면서 서로 다른 해석(예: 기간이나 범위가 다름)이어야 합니다.',
      '4. 원래 주장에 없는 사람 이름, 기관, 숫자, 사실을 지어 넣지 마세요. 빠진 기준·기간·지역만 채우세요.',
      '5. 후보는 각각 완결된 한 문장이어야 합니다.',
      '',
      '반드시 report_clarity 도구를 호출해 답하세요.',
      '',
      '[주장]',
      claim
    ].join('\n');
  }

  function showClarify(claim, missing, candidates) {
    $('clarifyWhy').textContent = missing.length ? '빠진 정보: ' + missing.join(', ') : '';
    const list = $('clarifyList');
    list.replaceChildren();
    candidates.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cand'; b.textContent = c;
      b.addEventListener('click', () => { $('claim').value = c; verify(true); });
      list.append(b);
    });
    $('useOriginal').onclick = () => verify(true);
    $('clarify').hidden = false;
  }

  // ---------- 판정 정리 (AI 답을 그대로 믿지 않는다) ----------
  function normalizeVerdict(v) {
    const s = String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    return VERDICTS.includes(s) ? s : HOLD;
  }

  function finalize(parsed, evidence) {
    const evCount = evidence.length;
    if (!parsed) {
      return { verdict: HOLD, summary: 'AI의 답을 해석하지 못해 판단을 유보합니다.', reason: 'AI 응답이 약속된 JSON 형식이 아니었습니다.', used: [] };
    }
    const used = Array.isArray(parsed.used)
      ? [...new Set(parsed.used.map(Number).filter(n => Number.isInteger(n) && n >= 1 && n <= evCount))].sort((a, b) => a - b)
      : [];
    let verdict = normalizeVerdict(parsed.verdict);
    let summary = String(parsed.summary || '').trim();
    let reason = String(parsed.reason || '').trim();
    if (verdict !== HOLD && used.length > 0 && used.every(n => evidence[n - 1].kind === K_COMM)) {
      verdict = HOLD;
      reason = '판정에 쓴 근거가 모두 블로그·커뮤니티 글이어서 판단을 유보합니다.' + (reason ? '\n(AI 설명) ' + reason : '');
    }
    if (verdict !== HOLD && used.length === 0) {
      // 근거 번호 없이 내린 판정은 인정하지 않는다.
      verdict = HOLD;
      reason = '판정에 쓴 근거 번호가 없어 판단을 유보합니다.' + (reason ? '\n(AI 설명) ' + reason : '');
    }
    if (!summary) summary = verdict === HOLD ? '주장을 판단할 직접 근거가 부족합니다.' : '';
    return { verdict, summary, reason, used };
  }

  // ---------- 그리기 (모든 외부 글자는 textContent 로만) ----------
  function safeHttpUrl(u) {
    try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch { return ''; }
  }

  function renderResult(r) {
    const badge = $('badge');
    badge.textContent = r.verdict;
    badge.className = 'badge v-' + r.verdict.replace(/\s+/g, '-');
    $('summary').textContent = r.summary;
    $('reason').textContent = r.reason;
    $('result').hidden = false;
  }

  function renderEvidence(evidence, used) {
    const list = $('evList');
    list.replaceChildren();
    evidence.forEach((e, i) => {
      const n = i + 1;
      const box = document.createElement('div'); box.className = 'ev';
      const head = document.createElement('div');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = '[' + n + '] ';
      const title = document.createElement('strong'); title.textContent = e.title;
      const kind = document.createElement('span'); kind.className = 'kind ' + (KIND_CLASS[e.kind] || 'k-etc'); kind.textContent = e.kind;
      head.append(no, kind, title);
      if (used.includes(n)) {
        const tag = document.createElement('span'); tag.className = 'used'; tag.textContent = '판정에 사용';
        head.append(tag);
      }
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.append(document.createTextNode('날짜: ' + (e.date || '날짜 정보 없음') + ' · 출처: '));
      const href = safeHttpUrl(e.url);
      if (href) {
        const a = document.createElement('a');
        a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = e.url;
        meta.append(a);
      } else {
        meta.append(document.createTextNode(e.url || '주소 없음'));
      }
      const body = document.createElement('div'); body.className = 'body'; body.textContent = e.content;
      box.append(head, meta, body);
      list.append(box);
    });
    $('evidence').hidden = evidence.length === 0;
  }

  // ---------- 검증 ----------
  async function verify(skipClarify) {
    clearOutput();
    const claim = $('claim').value.trim();
    const tKey = $('tavilyKey').value.trim();
    const cKey = $('claudeKey').value.trim();
    if (!claim) return showError('검증할 주장을 먼저 입력해 주세요.');
    if (!tKey) return showError('Tavily 키를 입력해 주세요.');
    if (!cKey) return showError('Claude 키를 입력해 주세요.');

    $('go').disabled = true;
    try {
      if (!skipClarify) {
        const { data: cd } = await askClaude(buildClarifyPrompt(claim), cKey, CLARIFY_TOOL);
        const c = parseClaudeResult(cd);
        const cands = c && Array.isArray(c.candidates)
          ? c.candidates.map(x => String(x || '').trim()).filter(Boolean).slice(0, 3) : [];
        if (c && c.ambiguous === true && cands.length >= 2) {
          showClarify(claim, Array.isArray(c.missing) ? c.missing.map(String) : [], cands);
          return;
        }
      }
      setStatus('Tavily에서 근거를 찾는 중…');
      const evidence = await searchTavily(claim, tKey);

      // 근거 0건: Claude에게 묻지 않고 무조건 판단 유보
      if (evidence.length === 0) {
        renderResult({ verdict: HOLD, summary: '관련 근거를 찾지 못했습니다.', reason: '검색 결과가 0건이어서 판단을 유보합니다. 주장을 더 구체적으로(이름, 기관, 지역, 날짜) 적어 다시 검증해 보세요.' });
        return;
      }

      // 근거가 블로그·커뮤니티뿐이면 Claude에게 묻지 않고 판단 유보
      if (evidence.every(e => e.kind === K_COMM)) {
        renderResult({ verdict: HOLD, summary: '블로그·커뮤니티 글뿐이어서 판단을 유보합니다.', reason: '찾은 근거가 모두 블로그·커뮤니티 글입니다. 정부·공공기관, 통계, 언론사 자료가 확인되지 않아 판정하지 않습니다.' });
        renderEvidence(evidence, []);
        return;
      }

      const { data } = await askClaude(buildPrompt(claim, evidence), cKey, VERDICT_TOOL);
      const result = finalize(parseClaudeResult(data), evidence);
      renderResult(result);
      renderEvidence(evidence, result.used);
    } catch (e) {
      showError(e instanceof UserError ? e.message : '알 수 없는 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    } finally {
      setStatus('');
      $('go').disabled = false;
    }
  }

  $('go').addEventListener('click', () => verify(false));
})();
</script>
</body>
</html>
